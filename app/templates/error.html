{% extends "base.html" %}
{% block title %}{{ title }} - {{ app_name }}{% endblock %}
{% block content %}
<div class="mx-auto max-w-xl px-4 py-24 text-center">
  <p class="text-6xl font-bold text-violet-600">{{ status }}</p>
  <h1 class="mt-4 text-2xl font-semibold">{{ title }}</h1>
  <p class="mt-3 text-zinc-600 dark:text-zinc-300">{{ message }}</p>
  <div class="mt-8 flex justify-center gap-3">
    <a href="{{ '/dashboard' if user else '/' }}" class="btn btn-primary">Go home</a>
  </div>
</div>
{% endblock %}
