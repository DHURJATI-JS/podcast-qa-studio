{# Mira - the AI co-host avatar. Original illustration; the mouth/eyes are animated by voice/avatar.js for lip-sync. #}
<svg viewBox="0 0 200 200" class="h-full w-full" role="img" aria-label="Mira, your AI podcast co-host" data-mira>
  <defs>
    <linearGradient id="mira-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="mira-skin" cx="0.45" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#f6d2b4"/>
      <stop offset="1" stop-color="#e5b18c"/>
    </radialGradient>
  </defs>
  <circle class="mira-glow" cx="100" cy="100" r="96" fill="#c4b5fd" opacity="0.35"/>
  <circle cx="100" cy="100" r="88" fill="url(#mira-bg)"/>
  <g data-mira-head>
    <!-- hair (back) -->
    <path d="M52 104c-6-46 18-74 48-74s56 26 48 74c-2 20-4 40-12 58H64c-8-18-10-38-12-58z" fill="#3b2116"/>
    <!-- neck + shoulders -->
    <path d="M86 140h28v18H86z" fill="#e2ab85"/>
    <path d="M40 200c4-30 26-44 60-44s56 14 60 44z" fill="#6d28d9"/>
    <path d="M84 156c4 8 28 8 32 0l6 4c-8 14-36 14-44 0z" fill="#f5f3ff" opacity="0.9"/>
    <!-- face -->
    <ellipse cx="100" cy="98" rx="38" ry="45" fill="url(#mira-skin)"/>
    <!-- hair (front fringe) -->
    <path d="M62 92c2-30 18-48 40-48 20 0 36 14 38 40-10-14-26-22-44-20-12 2-24 12-34 28z" fill="#4a2a1c"/>
    <!-- brows -->
    <path d="M78 82c5-4 12-4 17-1" stroke="#3b2116" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M105 81c5-3 12-3 17 1" stroke="#3b2116" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- eyes (ry is animated for blinks) -->
    <ellipse data-mira-eye cx="87" cy="94" rx="4.4" ry="5.4" fill="#2a1a12"/>
    <ellipse data-mira-eye cx="113" cy="94" rx="4.4" ry="5.4" fill="#2a1a12"/>
    <circle cx="88.6" cy="92.2" r="1.3" fill="#fff" opacity="0.9"/>
    <circle cx="114.6" cy="92.2" r="1.3" fill="#fff" opacity="0.9"/>
    <!-- cheeks + nose -->
    <circle cx="76" cy="110" r="7" fill="#f472b6" opacity="0.18"/>
    <circle cx="124" cy="110" r="7" fill="#f472b6" opacity="0.18"/>
    <path d="M100 98c-2 6-3 10 0 12" stroke="#c98b66" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- mouth: smile when idle, open ellipse while speaking -->
    <path data-mira-smile d="M89 122c6 6 16 6 22 0" stroke="#b4235a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <g data-mira-talk opacity="0">
      <ellipse data-mira-mouth cx="100" cy="123" rx="8" ry="2" fill="#7f1d3a"/>
      <ellipse data-mira-teeth cx="100" cy="119.5" rx="6" ry="1.2" fill="#fff" opacity="0.85"/>
      <ellipse data-mira-lips cx="100" cy="123" rx="9.5" ry="3.5" fill="none" stroke="#d6336c" stroke-width="2.2"/>
    </g>
    <!-- headphones -->
    <path d="M58 100c0-36 18-58 42-58s42 22 42 58" stroke="#18181b" stroke-width="7" fill="none" stroke-linecap="round"/>
    <rect x="48" y="92" width="16" height="30" rx="7" fill="#27272a"/>
    <rect x="136" y="92" width="16" height="30" rx="7" fill="#27272a"/>
    <rect x="51" y="97" width="5" height="20" rx="2.5" fill="#a78bfa"/>
    <rect x="144" y="97" width="5" height="20" rx="2.5" fill="#a78bfa"/>
    <!-- boom mic -->
    <path d="M146 118c0 14-10 22-26 24" stroke="#27272a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <rect x="110" y="137" width="14" height="9" rx="4.5" fill="#3f3f46"/>
  </g>
</svg>
