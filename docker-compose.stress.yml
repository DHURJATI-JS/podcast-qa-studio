# Stress-test stack: throwaway database/Redis in RAM, a fake LLM (OpenAI + Anthropic protocols,
# with injected failures), 4 web processes and 2 worker replicas. Never touches real data.
#   docker compose -f docker-compose.stress.yml up -d --build app worker fakellm
#   docker compose -f docker-compose.stress.yml run --rm stress
#   docker compose -f docker-compose.stress.yml down -v
name: podcastqa-stress

x-env: &env
  APP_ENV: production
  SECRET_KEY: stress-secret-key-0123456789abcdef0123456789abcdef
  DATABASE_URL: postgresql+asyncpg://podcastqa:stress-only-password@db:5432/podcastqa_stress
  REDIS_URL: redis://redis:6379/0
  BASE_URL: http://app:8000
  ALLOWED_HOSTS: app,localhost
  WEB_CONCURRENCY: "4"
  AI_PROVIDER_ORDER: gateway,anthropic,openai,local
  GATEWAY_BASE_URL: http://fakellm:9000/v1
  GATEWAY_API_KEY: fake-gateway-key
  GATEWAY_MODEL: gemma
  ANTHROPIC_API_KEY: fake-anthropic-key
  ANTHROPIC_BASE_URL: http://fakellm:9000
  ANTHROPIC_MODEL: fake-claude
  LOCAL_LLM_ENABLED: "false"
  TTS_ENABLED: "true"
  KOKORO_URL: http://kokoro:8880
  EMBEDDING_ORDER: hash
  WORKER_CONCURRENCY: "16"
  AI_CIRCUIT_COOLDOWN: "2"
  DB_POOL_SIZE: "10"
  DB_MAX_OVERFLOW: "20"
  RL_SIGNUP_IP: 100000/3600
  RL_LOGIN_IP: 100000/900
  RL_AI_HOUR: 100000/3600
  RL_AI_DAY: 100000/86400
  RL_PDF: 100000/600
  RL_API_WRITE: 600/60

services:
  db:
    image: pgvector/pgvector:0.8.1-pg17
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: podcastqa
      POSTGRES_PASSWORD: stress-only-password
      POSTGRES_DB: podcastqa_stress
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U podcastqa -d podcastqa_stress"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4.6-alpine
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  fakellm:
    build:
      context: .
      target: test
    image: podcastqa-test:stress
    command: ["uvicorn", "loadtest.fake_llm:app", "--host", "0.0.0.0", "--port", "9000", "--log-level", "warning"]
    environment:
      FAIL_RATE: "0.1"
      CHUNK_DELAY: ${FAKE_LLM_CHUNK_DELAY:-0.004}

  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.9.2

  app:
    build:
      context: .
      target: runtime
    image: podcastqa-app:stress
    environment: *env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: podcastqa-app:stress
    pull_policy: never
    command: ["python", "-m", "app.worker"]
    stop_grace_period: 45s
    environment: *env
    deploy:
      replicas: 2
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

  stress:
    image: podcastqa-test:stress
    pull_policy: never
    command: ["python", "-m", "loadtest.stress", "http://app:8000"]
    environment:
      STRESS_USERS: "40"
    depends_on:
      app:
        condition: service_healthy
      fakellm:
        condition: service_started

  # 10-minute Locust run (staged load shape in loadtest/locustfile.py):
  #   docker compose -f docker-compose.stress.yml run --name pq-locust locust
  #   docker cp pq-locust:/home/locust/. loadtest/results/<run>/   (HTML report + CSVs)
  locust:
    build:
      context: .
      dockerfile: loadtest/Dockerfile.locust
    image: podcastqa-locust:stress
    command: ["-f", "/home/locust/locustfile.py", "--headless", "--host", "http://app:8000", "--processes", "4",
              "--html", "/home/locust/report.html", "--csv", "/home/locust/stats", "--loglevel", "WARNING", "--only-summary"]
    depends_on:
      app:
        condition: service_healthy
      fakellm:
        condition: service_started
